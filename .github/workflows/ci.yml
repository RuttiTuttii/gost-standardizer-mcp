name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Set up Typst
        uses: typst-community/setup-typst@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install coverage

      - name: Run test suite with coverage
        run: |
          coverage run -m unittest discover tests
          coverage report --fail-under=90 -m

      - name: Verify CLI & Typst workflow
        run: |
          python -m gost_standardizer.cli.main --help
          python -m gost_standardizer.cli.main presets
          python -m gost_standardizer.cli.main typst-render --preset report --title "Тестовый отчет" -o sample.typ
          typst compile sample.typ sample.pdf
          test -f sample.pdf
